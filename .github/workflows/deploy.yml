name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=latest
          REPOSITORY_URI=your_account_id.dkr.ecr.us-west-2.amazonaws.com/your_repository_name
          docker build -t $REPOSITORY_URI:$IMAGE_TAG .
          docker push $REPOSITORY_URI:$IMAGE_TAG

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Update task definition with new image
        run: |
          IMAGE_URI=your_account_id.dkr.ecr.us-west-2.amazonaws.com/your_repository_name:latest
          sed -i 's|your_account_id.dkr.ecr.us-west-2.amazonaws.com/your_repository_name:.*|'"$IMAGE_URI"'|g' ecs/task_definition.json

      - name: Register ECS task definition
        id: register_task_definition
        run: |
          NEW_TASK_DEFINITION=$(cat ecs/task_definition.json)
          CURRENT_TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition my-app-task --query "taskDefinition" --output json)

          if [ "$NEW_TASK_DEFINITION" != "$CURRENT_TASK_DEFINITION" ]; then
            echo "Task definition has changed. Registering new task definition."
            aws ecs register-task-definition --cli-input-json file://ecs/task_definition.json
            echo "::set-output name=task_definition_changed::true"
          else
            echo "Task definition has not changed. Skipping registration."
            echo "::set-output name=task_definition_changed::false"
          fi

      - name: Update ECS service with new task definition
        if: steps.register_task_definition.outputs.task_definition_changed == 'true'
        run: |
          CLUSTER_NAME=your_ecs_cluster_name
          SERVICE_NAME=your_ecs_service_name
          TASK_FAMILY=my-app-task

          # Get the latest revision of the task definition
          TASK_DEFINITION=$(aws ecs describe-task-definition --task-definition $TASK_FAMILY --query "taskDefinition.taskDefinitionArn" --output text)

          # Update the ECS service with the new task definition
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --task-definition $TASK_DEFINITION --force-new-deployment

      - name: Force new deployment with latest image
        if: steps.register_task_definition.outputs.task_definition_changed == 'false'
        run: |
          CLUSTER_NAME=your_ecs_cluster_name
          SERVICE_NAME=your_ecs_service_name
          CONTAINER_NAME=your_container_name
          IMAGE_URI=your_account_id.dkr.ecr.us-west-2.amazonaws.com/your_repository_name:latest

          # Update the ECS service with the new image
          aws ecs update-service --cluster $CLUSTER_NAME --service $SERVICE_NAME --force-new-deployment --task-definition $(aws ecs describe-task-definition --task-definition $SERVICE_NAME --query "taskDefinition.taskDefinitionArn" --output text)
